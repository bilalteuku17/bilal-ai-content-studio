# Deploy Cloudflare Worker using the current repository-level Cloudflare secret.
# Triggered after credential rotation.
name: Deploy HUMAN CAPITAL WORKSPACE API

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover Cloudflare account
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow run. Trigger this workflow from a push to main or workflow_dispatch, not a pull_request."
            exit 1
          fi
          RESPONSE=$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")
          ACCOUNT_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')
          if [ -z "$ACCOUNT_ID" ]; then
            echo "Unable to discover Cloudflare account ID using the saved token."
            echo "$RESPONSE" | jq '{success, errors}'
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Inspect existing D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          RESPONSE=$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database")
          if [ "$(echo "$RESPONSE" | jq -r '.success // false')" != "true" ]; then
            ERRORS=$(echo "$RESPONSE" | jq -c '.errors // []')
            echo "::warning::D1 listing is unavailable to this token: $ERRORS"
            exit 0
          fi
          COUNT=$(echo "$RESPONSE" | jq '.result | length')
          echo "D1 databases found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "$RESPONSE" | jq -r '.result[] | [.name, .uuid] | @tsv'
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.account.outputs.account_id }}
          workingDirectory: "worker"
          command: d1 migrations apply human-capital-workspace-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.account.outputs.account_id }}
          workingDirectory: "worker"
          command: deploy

      - name: Verify Worker health endpoint
        env:
          HEALTH_URL: https://human-capital-workspace-ai.bilalteuku17.workers.dev/health
        run: |
          RESPONSE=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused --max-time 15 "$HEALTH_URL")
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.status == "online"' >/dev/null
          DATABASE=$(echo "$RESPONSE" | jq -r '.database // "unknown"')
          AI_ENGINE=$(echo "$RESPONSE" | jq -r '.ai_engine // "unknown"')
          echo "Database status: $DATABASE"
          echo "AI engine status: $AI_ENGINE"
          if [ "$DATABASE" != "connected" ]; then
            echo "::error::D1 is not ready: $DATABASE"
            exit 1
          fi
          if [ "$AI_ENGINE" = "not_configured" ]; then
            echo "::notice::Worker is an API foundation; AI execution is not configured yet."
          fi
