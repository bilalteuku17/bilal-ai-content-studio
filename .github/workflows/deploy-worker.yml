# Deploy Cloudflare Worker using the current repository-level Cloudflare secret.
# Triggered after credential rotation or a manual maintenance commit.
name: Deploy HUMAN CAPITAL WORKSPACE API

on:
  push:
    branches: ["main"]
    paths:
      - "worker/src/**"
      - "worker/migrations/**"
      - "worker/wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HCW_API_KEY: ${{ secrets.HCW_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is required before deploying the Worker."
            exit 1
          fi
          if [ -z "$HCW_API_KEY" ]; then
            echo "::error::HCW_API_KEY repository secret is required; refusing to deploy an API that clients cannot authenticate to."
            exit 1
          fi

      - name: Discover Cloudflare account
        id: account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is unavailable to this workflow run. Trigger this workflow from a push to main or workflow_dispatch, not a pull_request."
            exit 1
          fi
          RESPONSE=$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts")
          ACCOUNT_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')
          if [ -z "$ACCOUNT_ID" ]; then
            echo "Unable to discover Cloudflare account ID using the saved token."
            echo "$RESPONSE" | jq '{success, errors}'
            exit 1
          fi
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Inspect existing D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          RESPONSE=$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database")
          if [ "$(echo "$RESPONSE" | jq -r '.success // false')" != "true" ]; then
            ERRORS=$(echo "$RESPONSE" | jq -c '.errors // []')
            echo "::warning::D1 listing is unavailable to this token: $ERRORS"
            exit 0
          fi
          COUNT=$(echo "$RESPONSE" | jq '.result | length')
          echo "D1 databases found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "$RESPONSE" | jq -r '.result[] | [.name, .uuid] | @tsv'
          fi

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.account.outputs.account_id }}
          workingDirectory: "worker"
          wranglerVersion: "4.165.0"
          command: d1 migrations apply human-capital-workspace-db --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.account.outputs.account_id }}
          workingDirectory: "worker"
          wranglerVersion: "4.165.0"
          command: deploy

      - name: Sync required Worker API key
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          HCW_API_KEY: ${{ secrets.HCW_API_KEY }}
        run: |
          printf '%s' "$HCW_API_KEY" | npx wrangler secret put HCW_API_KEY

      - name: Verify task API authentication
        env:
          HCW_API_KEY: ${{ secrets.HCW_API_KEY }}
          API_BASE: https://human-capital-workspace-ai.bilalteuku17.workers.dev
        run: |
          STATUS=$(curl --silent --show-error --output /tmp/hcw-unauth.json --write-out "%{http_code}" "$API_BASE/api/tasks")
          if [ "$STATUS" != "401" ]; then
            echo "::error::Unauthenticated task API should return HTTP 401, received $STATUS."
            cat /tmp/hcw-unauth.json
            exit 1
          fi
          echo "Unauthenticated task API correctly returns HTTP 401."
          AUTH_STATUS=$(curl --silent --show-error --output /tmp/hcw-auth.json --write-out "%{http_code}" -H "x-hcw-key: $HCW_API_KEY" "$API_BASE/api/tasks")
          if [ "$AUTH_STATUS" != "200" ]; then
            echo "::error::Authenticated task API should return HTTP 200, received $AUTH_STATUS."
            cat /tmp/hcw-auth.json
            exit 1
          fi
          echo "Authenticated task API correctly returns HTTP 200."

      - name: Verify authenticated AI task end-to-end
        env:
          HCW_API_KEY: ${{ secrets.HCW_API_KEY }}
          API_BASE: https://human-capital-workspace-ai.bilalteuku17.workers.dev
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          TASK_ID="hcw-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TASK_CREATED=0
          cleanup() {
            local original_status=$?
            local delete_status verify_status
            local cleanup_failed=0

            trap - EXIT

            if [ "$TASK_CREATED" = "1" ]; then
              delete_status=$(curl --silent --show-error --max-time 20 \
                --output /tmp/hcw-smoke-delete.json --write-out "%{http_code}" \
                -X DELETE -H "x-hcw-key: $HCW_API_KEY" \
                "$API_BASE/api/tasks/$TASK_ID") || delete_status="000"

              if [ "$delete_status" != "200" ] && [ "$delete_status" != "404" ]; then
                echo "::warning::Smoke-test DELETE returned HTTP $delete_status; checking whether the task is absent."
                cat /tmp/hcw-smoke-delete.json 2>/dev/null || true
              fi

              verify_status=$(curl --silent --show-error --max-time 20 \
                --output /tmp/hcw-smoke-cleanup-verify.json --write-out "%{http_code}" \
                -H "x-hcw-key: $HCW_API_KEY" "$API_BASE/api/tasks/$TASK_ID") || verify_status="000"

              if [ "$verify_status" != "404" ]; then
                echo "::error::Smoke-test cleanup could not be verified; follow-up GET returned HTTP $verify_status."
                cat /tmp/hcw-smoke-cleanup-verify.json 2>/dev/null || true
                cleanup_failed=1
              else
                echo "Smoke-test task cleanup verified: the task is no longer available."
              fi
            else
              echo "No smoke-test task was created; cleanup was not required."
            fi

            if [ "$original_status" -ne 0 ]; then
              exit "$original_status"
            fi
            if [ "$cleanup_failed" -ne 0 ]; then
              exit 1
            fi
            exit 0
          }
          trap cleanup EXIT

          CREATE_STATUS=$(curl --silent --show-error --output /tmp/hcw-smoke-create.json --write-out "%{http_code}" \
            -X POST -H "x-hcw-key: $HCW_API_KEY" -H "content-type: application/json" \
            --data "$(jq -n --arg id "$TASK_ID" '{title:"[SYSTEM] Deployment AI smoke test",description:"Create a brief confirmation that the HCW AI task execution test is running.",owner_id:1,client_id:$id}')" \
            "$API_BASE/api/tasks")
          if [ "$CREATE_STATUS" != "201" ] && [ "$CREATE_STATUS" != "200" ]; then
            echo "::error::Could not create authenticated smoke-test task (HTTP $CREATE_STATUS)."
            cat /tmp/hcw-smoke-create.json
            exit 1
          fi
          TASK_CREATED=1
          jq -e --arg id "$TASK_ID" '.task.id == $id' /tmp/hcw-smoke-create.json >/dev/null

          RUN_STATUS=$(curl --silent --show-error --output /tmp/hcw-smoke-run.json --write-out "%{http_code}" \
            -X POST -H "x-hcw-key: $HCW_API_KEY" "$API_BASE/api/tasks/$TASK_ID/run")
          if [ "$RUN_STATUS" != "200" ]; then
            echo "::error::AI task execution failed (HTTP $RUN_STATUS)."
            cat /tmp/hcw-smoke-run.json
            exit 1
          fi
          jq -e '.task.status == "completed" and ((.task.result // "") | length > 0) and (.task.ai_model != null)' /tmp/hcw-smoke-run.json >/dev/null

          READ_STATUS=$(curl --silent --show-error --output /tmp/hcw-smoke-read.json --write-out "%{http_code}" \
            -H "x-hcw-key: $HCW_API_KEY" "$API_BASE/api/tasks/$TASK_ID")
          if [ "$READ_STATUS" != "200" ]; then
            echo "::error::Could not read completed smoke-test task (HTTP $READ_STATUS)."
            cat /tmp/hcw-smoke-read.json
            exit 1
          fi
          jq -e '.task.status == "completed" and ((.task.result // "") | length > 0)' /tmp/hcw-smoke-read.json >/dev/null
          echo "Authenticated task creation, real AI inference, D1 result persistence, and task retrieval all passed."

      - name: Verify Worker health endpoint
        env:
          HEALTH_URL: https://human-capital-workspace-ai.bilalteuku17.workers.dev/health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused --max-time 15 \
            --dump-header /tmp/hcw-health-headers.txt --output /tmp/hcw-health.json "$HEALTH_URL"
          RESPONSE=$(cat /tmp/hcw-health.json)
          if ! grep -Eiq '^access-control-allow-origin:[[:space:]]*\*' /tmp/hcw-health-headers.txt; then
            echo "::error::Worker health endpoint is missing the CORS allow-origin header."
            cat /tmp/hcw-health-headers.txt
            exit 1
          fi
          echo "Worker health endpoint CORS check passed."
          echo "$RESPONSE" | jq .
          echo "$RESPONSE" | jq -e '.status == "online"' >/dev/null
          DATABASE=$(echo "$RESPONSE" | jq -r '.database // "unknown"')
          API_AUTH=$(echo "$RESPONSE" | jq -r '.api_auth // "unknown"')
          AI_ENGINE=$(echo "$RESPONSE" | jq -r '.ai_engine // "unknown"')
          echo "Database status: $DATABASE"
          echo "API auth status: $API_AUTH"
          echo "AI engine status: $AI_ENGINE"
          if [ "$API_AUTH" != "configured" ]; then
            echo "::error::Worker API authentication is not configured."
            exit 1
          fi
          if [ "$AI_ENGINE" != "binding_ready" ]; then
            echo "::error::Workers AI binding is not ready."
            exit 1
          fi
          if [ "$DATABASE" != "connected" ]; then
            echo "::error::D1 is not ready: $DATABASE"
            exit 1
          fi
          if [ "$AI_ENGINE" = "not_configured" ]; then
            echo "::notice::Worker is an API foundation; AI execution is not configured yet."
          fi
