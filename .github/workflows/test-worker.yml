name: Test HUMAN CAPITAL WORKSPACE Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/test-worker.yml"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/test-worker.yml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker API tests
        run: npm test --prefix worker
