name: Deploy HUMAN CAPITAL WORKSPACE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Do not cancel an active Pages deployment: cancelling deploy-pages mid-flight
# can leave a GitHub deployment stuck in "in_progress" and block later builds.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Clear stale Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const cutoff = Date.now() - 10 * 60 * 1000;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: "github-pages",
              per_page: 100
            });

            let cleared = 0;
            for (const deployment of deployments) {
              if (deployment.environment !== "github-pages") continue;
              if (deployment.sha === context.sha) continue;
              if (Date.parse(deployment.created_at || "") >= cutoff) continue;

              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1
              });
              const latest = statuses[0];
              if (!latest || !["in_progress", "queued"].includes(latest.state)) continue;

              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Superseded by a newer HUMAN CAPITAL WORKSPACE Pages build."
              });
              core.notice(`Marked stale Pages deployment ${deployment.id} (${deployment.sha.slice(0, 7)}) inactive.`);
              cleared++;
            }
            core.notice(`Stale Pages deployments cleared: ${cleared}.`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
